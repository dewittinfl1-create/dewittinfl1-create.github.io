name: Swap final7 to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap merged file to index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f merged-index-final7.html index.html
          git commit -m "Deploy merged-index-final7 as index.html (54 services correction)"
          git push
