name: Replace index.html with merged-index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          rm -f index.html
          mv merged-index.html index.html
          git config user.name "dewittinfl1-create"
          git config user.email "dewittinfl1-create@users.noreply.github.com"
          git add index.html
          git status --short
          git commit -m "Replace index.html with updated site"
          git push
