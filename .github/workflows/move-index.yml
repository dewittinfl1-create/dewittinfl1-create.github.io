name: Move merged index to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move merged file to index.html
        run: |
          git config user.name "dewittinfl1-create"
          git config user.email "dewittinfl1-create@users.noreply.github.com"
          git mv -f merged-index-final5.html index.html
          git commit -m "Replace index.html with merged-index-final5 (Wahl trimmer shop pick)"
          git push
