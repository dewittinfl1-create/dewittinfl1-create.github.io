name: Move merged index to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename merged file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -l merged-index-final4.html index.html
          mv -f merged-index-final4.html index.html
          git add -A
          git status --short
          git commit -m "Replace index.html: add Ahopegarden Hydroponics Growing System shop pick"
          git push
