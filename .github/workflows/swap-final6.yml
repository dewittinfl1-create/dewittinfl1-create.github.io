name: Swap final6 to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap merged-index-final6.html to index.html
        run: |
          git config user.name "dewittinfl1-create"
          git config user.email "dewittinfl1-create@users.noreply.github.com"
          git mv -f merged-index-final6.html index.html
          git commit -m "Deploy merged-index-final6 as index.html (add Bilingual Business Reel service)"
          git push
