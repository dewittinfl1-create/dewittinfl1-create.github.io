<style>
:root{
  --green:#14532D; --green-dark:#0E3D21; --gold:#D4AF37; --gold-soft:#F6E7B8;
  --burgundy:#7B1E2B; --bg:#FDFBF5; --surface:#FFFFFF; --surface2:#F7F3E6;
  --ink:#22301F; --muted:#5D6B58; --line:#E5DFC8;
  --radius:16px; --radius-lg:22px;
  --shadow:0 2px 10px rgba(20,83,45,.07),0 10px 30px rgba(20,83,45,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
a{color:var(--green)}
/* header */
header.finder{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);color:#FFFDF4;padding:22px 0 26px;border-bottom:4px solid var(--gold)}
.backlink{display:inline-block;color:var(--gold-soft);font-weight:700;text-decoration:none;font-size:.95rem;min-height:44px;padding:10px 4px}
.backlink:hover{text-decoration:underline;color:#fff}
.sitename{font-size:1rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin-top:2px}
header.finder h1{font-size:2.1rem;font-weight:900;color:#fff;margin:4px 0 8px}
.explainer{font-size:1.08rem;color:#F3EDD3;max-width:640px;margin:0}
/* language toggle */
.langtoggle{display:inline-flex;background:rgba(255,255,255,.14);border:1.5px solid var(--gold);border-radius:999px;padding:4px;margin-top:16px}
.langtoggle button{border:0;background:transparent;color:#FFFDF4;font:inherit;font-weight:800;font-size:1rem;min-height:44px;min-width:92px;padding:8px 20px;border-radius:999px;cursor:pointer}
.langtoggle button.active{background:var(--gold);color:#2A2100}
/* search */
.searchbar{margin:26px 0 6px}
.searchbar label{font-weight:800;font-size:1.05rem;display:block;margin-bottom:8px}
.searchrow{display:flex;gap:10px}
.searchrow input{flex:1;font:inherit;font-size:1.1rem;padding:14px 16px;min-height:56px;border:2px solid var(--green);border-radius:14px;background:var(--surface);color:var(--ink)}
.searchrow input:focus{outline:3px solid var(--gold);outline-offset:1px}
.clearbtn{font:inherit;font-weight:800;min-height:56px;padding:0 20px;border-radius:14px;border:2px solid var(--burgundy);background:#fff;color:var(--burgundy);cursor:pointer;display:none}
.clearbtn.show{display:block}
/* category chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.chip{font:inherit;font-weight:700;font-size:1rem;min-height:48px;padding:10px 18px;border-radius:999px;border:2px solid var(--green);background:#fff;color:var(--green-dark);cursor:pointer}
.chip:hover{background:var(--surface2)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.chip .n{opacity:.65;font-weight:600;font-size:.88em;margin-left:5px}
/* results */
.count{font-weight:700;color:var(--muted);margin:20px 0 12px;font-size:1.02rem}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:10px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.14rem;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:.99rem;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pricechip{background:var(--burgundy);color:#fff;font-weight:900;font-size:1.02rem;padding:5px 13px;border-radius:999px}
.langchip{background:var(--surface2);border:1.5px solid var(--gold);color:#6B5510;font-weight:800;font-size:.82rem;letter-spacing:.05em;padding:4px 11px;border-radius:999px;text-transform:uppercase}
.catchip{background:var(--surface2);color:var(--green-dark);font-weight:700;font-size:.82rem;padding:4px 11px;border-radius:999px}
.buybtn{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:900;font-size:1.08rem;min-height:52px;padding:13px 16px;border-radius:12px;margin-top:4px}
.buybtn:hover{background:var(--green-dark)}
/* empty state */
.empty{display:none;background:var(--surface);border:2px dashed var(--gold);border-radius:var(--radius-lg);padding:30px 22px;text-align:center;margin:14px 0 30px}
.empty.show{display:block}
.empty h2{font-size:1.35rem;color:var(--burgundy);margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto;max-width:520px}
footer{border-top:1px solid var(--line);margin-top:26px;padding:20px 0 34px;color:var(--muted);font-size:.92rem;text-align:center}
footer a{font-weight:700}
</style>
</head>

  }
};

/* Bilingual synonym map: normalized term -> extra normalized terms to match.
   Works both directions because ES words also appear as keys. */

};

function norm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function queryGroups(q){
  /* One group per query word: the word OR any of its bilingual synonyms.
     An item matches when EVERY group has at least one hit in the item text. */
  return norm(q).split(/[^a-z0-9ñ]+/).filter(Boolean)
    .map(w => [w].concat((SYN[w]||[]).map(norm)));
}
function haystack(item, lang){
  const catLabel = norm((I18N.en.cats[item.cat]||"") + " " + (I18N.es.cats[item.cat]||"") + " " + item.cat);
  return norm(item.t + " " + item.d + " " + catLabel + " " + item.lang);
}

let curLang = "en";
let curCat = "all";
const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const chipsEl = document.getElementById("chips");
const qEl = document.getElementById("q");
const clearBtn = document.getElementById("clear");

const catCounts = {};
CATALOG.forEach(it => { catCounts[it.cat] = (catCounts[it.cat]||0) + 1; });
const catOrder = ["templates","money","health","business","life","party","spreadsheets","wedding","services"]
  .filter(c => catCounts[c]);

function buildChips(){
  const L = I18N[curLang];
  chipsEl.innerHTML = "";
  const mk = (cat, label, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (curCat === cat ? " active" : "");
    b.setAttribute("aria-pressed", curCat === cat ? "true" : "false");
    b.innerHTML = "";
    b.appendChild(document.createTextNode(label));
    const s = document.createElement("span"); s.className = "n"; s.textContent = n;
    b.appendChild(s);
    b.addEventListener("click", () => { curCat = cat; buildChips(); render(); });
    chipsEl.appendChild(b);
  };
  mk("all", L.all, CATALOG.length);
  catOrder.forEach(c => mk(c, L.cats[c] || c, catCounts[c]));
}

function render(){
  const L = I18N[curLang];
  const groups = queryGroups(qEl.value);
  const list = CATALOG.filter(it => {
    if (curCat !== "all" && it.cat !== curCat) return false;
    if (!groups.length) return true;
    const h = haystack(it);
    return groups.every(g => g.some(t => h.includes(t)));
  });
  countEl.textContent = L.results(list.length);
  emptyEl.classList.toggle("show", list.length === 0);
  clearBtn.classList.toggle("show", qEl.value.length > 0);
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.forEach(it => {
    const card = document.createElement("article");
    card.className = "card";
    const h = document.createElement("h3"); h.textContent = it.t; card.appendChild(h);
    const p = document.createElement("p"); p.textContent = it.d; card.appendChild(p);
    const meta = document.createElement("div"); meta.className = "meta";
    const price = document.createElement("span"); price.className = "pricechip";
    price.textContent = "$" + (Number.isInteger(it.p) ? it.p : it.p.toFixed(2));
    meta.appendChild(price);
    const lc = document.createElement("span"); lc.className = "langchip";
    lc.textContent = it.lang === "ES" ? "Español" : "English";
    meta.appendChild(lc);
    const cc = document.createElement("span"); cc.className = "catchip";
    cc.textContent = L.cats[it.cat] || it.cat;
    meta.appendChild(cc);
    card.appendChild(meta);
    const a = document.createElement("a");
    a.className = "buybtn"; a.href = BUY_BASE + it.id; a.textContent = L.getit;
    card.appendChild(a);
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function setLang(lang){
  curLang = lang;
  const L = I18N[lang];
  document.documentElement.lang = lang === "es" ? "es" : "en";
  document.title = (lang === "es" ? "Encuentra tu formulario" : "Find Your Form") + " — Christopher DeWitt's Shop";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (L[k]) el.textContent = L[k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const k = el.getAttribute("data-i18n-ph");
    if (L[k]) el.setAttribute("placeholder", L[k]);
  });
  document.getElementById("btnEN").classList.toggle("active", lang === "en");
  document.getElementById("btnES").classList.toggle("active", lang === "es");
  buildChips();
  render();
}

document.getElementById("btnEN").addEventListener("click", () => setLang("en"));
document.getElementById("btnES").addEventListener("click", () => setLang("es"));
qEl.addEventListener("input", render);
clearBtn.addEventListener("click", () => { qEl.value = ""; render(); qEl.focus(); });

setLang("en");
</script>
